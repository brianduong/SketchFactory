<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
  <title>SketchFactory Facebook cover</title>
  <desc>Facebook cover with a warm paper background, wordmark, tagline and simple line drawings.</desc>
  <rect width="1640" height="624" fill="#FFFDF7"/>
  <path d="M0 0 H1640 V165 C1270 255 970 105 620 180 C355 238 165 235 0 198 Z"
        fill="#F4D35E"/>
  <circle cx="1480" cy="505" r="245" fill="#F4D35E"/>

  <!-- Leave the lower-left clear for the Facebook profile picture overlay. -->
  <g transform="translate(500 205)" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">
    <text x="0" y="95" font-size="104" font-weight="800" letter-spacing="-4"
          fill="#111111">SketchFactory</text>
    <text x="5" y="165" font-size="34" font-weight="700" letter-spacing="3"
          fill="#111111">DRAW ANYTHING · THE SIMPLE WAY</text>
    <text x="5" y="225" font-size="27" font-weight="500" fill="#555555">
      Simple drawing lessons for teachers, creators &amp; beginners
    </text>
  </g>

  <g transform="translate(1330 250)" fill="none" stroke="#111111" stroke-width="19"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="105" r="90" fill="#FFFDF7"/>
    <path d="M42 40 L48 -35 L105 20 M96 20 L152 -35 L160 45"/>
    <circle cx="73" cy="100" r="7" fill="#111111"/>
    <circle cx="128" cy="100" r="7" fill="#111111"/>
    <path d="M100 125 Q82 150 64 132 M100 125 Q118 150 136 132"/>
    <path d="M58 126 L12 115 M58 148 L5 155 M142 126 L188 115 M142 148 L195 155"/>
  </g>

  <g transform="translate(250 115) rotate(-18)" stroke="#111111" stroke-width="18"
     stroke-linejoin="round">
    <rect x="0" y="0" width="60" height="220" rx="16" fill="#EF6F6C"/>
    <path d="M0 220 L30 278 L60 220 Z" fill="#F5C99B"/>
    <path d="M19 258 L30 278 L41 258 Z" fill="#111111" stroke="none"/>
  </g>
</svg>
